name: Build and Publish Docker Image

on:
    push:
        branches:
            - main
        tags:
            - 'php*'
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: digitalblake/core-wp-wordpress
                  tags: |
                      # Tag push: php8.4-1.2.3 → publish that exact tag + php8.4-latest
                      type=match,pattern=php(\d+\.\d+)-(.+),group=0
                      type=match,pattern=php(\d+\.\d+)-(.+),suffix=-latest,group=1,prefix=php
                      # main branch push → latest
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            - name: Build and push
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64,linux/arm64

            # Scan the actual built image (post apk-upgrade) and send a snapshot
            # to Snyk. This reads the real layers, so it reflects what ships —
            # unlike the GitHub Dockerfile project, which only sees the base
            # image's pre-upgrade CVEs. monitor never fails the publish.
            - name: Snyk monitor the published image
              uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
              continue-on-error: true
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  image: digitalblake/core-wp-wordpress:php8.4-latest
                  args: --file=Dockerfile --project-name=core-wp-wordpress-image
                  command: monitor
